<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Class Info</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>
    <div>
        <h1 style="font-size: xx-large;">Get info about a class of train <p id="redbold" style="font-size: xx-large;">easier than ever.</p></h1>
    </div>
    <div>
        <label for="class_input">Class: </label>
        <input type="number" id="class_input" placeholder="e.g. 755"><br><br>
        <p id="summary"></p>
        <button id="get_info" type="button">Get info.</button>
    </div>
    <button type="button" onclick="window.location.href = 'https://runes121.github.io/'" id="mainsitebtn">back to main site</button>
    <div id="credits">Summaries taken from Wikipedia.</div>
</body>
</html>
