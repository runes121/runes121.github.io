<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Mode Picker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
   <header>Pick game mode:</header>
    <div>
        <label for="modes">Gamemodes: </label>
        <input type="text" id="modes" placeholder="e.g. single,duo,trio,quad"></input><br>
    </div>
    <script>
        function pickMode() {
            const modes = document.getElementById("modes").value.split(",")
            const random_mode_index = Math.floor(Math.random() * modes.length)
            document.getElementById("chosen_mode").textContent = "Chosen Gamemode: " + modes[random_mode_index]
        }
    </script>
    <span id="chosen_mode">Chosen Gamemode: </span><br><br>
    <button type="button" onclick="pickMode()">Choose Gamemode</button>
    <button type="button" onclick="window.location.href = 'https://runes121.github.io/'" id="mainsitebtn">back to main site</button>
</body>
</html>
