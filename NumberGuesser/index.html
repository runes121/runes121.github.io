<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guesser</title>
    <link rel="stylesheet" href="styles.css">
    <script src="game.js"></script>
</head>
<body>
    <h1>I am thinking of a number from 1-100. Try to guess it!</h1><br><br>
    <div id="confettiContainer">
        <div class="confetti"></div>
    </div>
    <div id="statusContainer">
        <h2 id="status"></h2>
    <div><!--<br><br>-->
    <div class="guessContainer">
        <input type="number" id="input">
        <button type="button" id="guess">Guess!</button>
    </div><br><br><br>
    <button type="button" onclick="window.location.href = 'https://runes121.github.io/'" id="mainsitebtn">back to main site</button>
</body>
</html>
